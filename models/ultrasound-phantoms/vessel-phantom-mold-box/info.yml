name: Vessel phantom mold box
intervention: Ultrasound-guided vascular access
description: Open-top mold box with V-notches on both end walls at three staggered depths. Lay tubing across, pour gelatin, and get a vascular phantom with vessels at roughly 10, 20, and 30 mm below the surface in one block. OpenSCAD source included.
license: CC BY-NC-SA 4.0
print_notes: PLA or PETG, 3 perimeters, no supports, prints upright.
consumables: Latex or surgical tubing, ballistic gelatin (100 g gelatin, 900 mL water, 20 g flour per batch).
credit: Original design for this repository
