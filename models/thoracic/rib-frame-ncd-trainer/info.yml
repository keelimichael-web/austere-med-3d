name: Rib frame for needle decompression and finger thoracostomy
intervention: Needle decompression, finger thoracostomy
description: Three-part press-fit rib frame with open space beneath, so a correct entry passes into free air. Cover with foam, gelatin, or pork belly as the chest wall. OpenSCAD source included.
license: CC BY-NC-SA 4.0
print_notes: PLA, 3 perimeters, no supports. Print 2 rails and 3 rib bars; all parts print flat.
consumables: Chest wall covering, 15-20 mm of upholstery foam, ballistic gelatin, or pork belly.
credit: Original design for this repository
tier: basic
