# Models and resources hosted elsewhere. These render on the catalog page
# alongside the models stored in this repository.
#
# Fields: name (required), url (required), category, source, notes, credit,
# image (hotlinked preview URL from the source site; optional).
# Credit people by name only with their OK; "working group" is always fine.
# Public platform authors are credited by their published handle, as their
# licenses require attribution.

- name: Cric Airway Trainer
  category: airway
  url: https://makerworld.com/en/models/750065
  source: MakerWorld
  notes: Cricothyrotomy training model for physicians and paramedics; vinyl tape serves as the cricothyroid membrane. By HealthcareSim Guy, CC BY 4.0.
  image: https://makerworld.bblmw.com/makerworld/model/USff933ff0f8e202/design/2025-07-04_b283a143d18fa8.jpeg?x-oss-process=image/resize,w_1200/ignore-error,1

- name: Simple Cric Trainer and Mold
  category: airway
  url: https://www.printables.com/model/836133-simple-cric-trainer-and-mold
  source: Printables
  notes: Minimal cric trainer plus a casting mold; duct tape works for the membrane. By Miles L, CC BY 4.0.
  image: https://media.printables.com/media/prints/836133/images/6442606_c60fabe5-c7f2-4a2c-a0b0-b4931ffcfbc1_eb229b7c-7bde-454d-b558-e549e53125fa/thumbs/cover/1200x630/jpg/48ad24c7-7c44-4a17-a1b9-e3a8ed6d65ab.jpg

- name: CICO Rescue Cricothyroidotomy Trainer
  category: airway
  url: https://www.thingiverse.com/thing:2530474
  source: Thingiverse
  notes: Free neck-and-larynx combination trainer built to accompany the Vortex Approach CICO teaching material (vortexapproach.org). By drandybuck, CC BY-NC-ND 4.0.

- name: High-fidelity cric trainer (validated)
  category: airway
  url: https://jdc.jefferson.edu/otofp/122/
  source: OTO Open (journal)
  notes: Peer-reviewed 2026 study of a 3D-printed airway model layered with porcine soft tissue; trainee confidence rose significantly. The three STL files are free downloads under "Additional Files" on the article page. Schlegel, Tekumalla et al., Thomas Jefferson University, CC BY-NC-ND 4.0.

- name: Pediatric needle-cric scaling guide
  category: airway
  url: https://jetem.org/3d_airway/
  source: JETem (journal)
  notes: Open-access recipe for printing neonatal, school-age, and adolescent needle cricothyrotomy trainers by scaling an adult model to 25, 33, and 50 percent, with neonatal dimensions anchored to cadaveric measurements. Article CC BY 4.0; the base STL comes from The Airway App template library.

