# Models and resources hosted elsewhere. These render on the catalog page
# alongside the models stored in this repository.
#
# Fields: name (required), url (required), category, source, notes, credit,
# image (hotlinked preview URL from the source site; optional).
# Credit people by name only with their OK; "working group" is always fine.
# Public platform authors are credited by their published handle, as their
# licenses require attribution.

