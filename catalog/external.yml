- name: CICO Rescue Cricothyroidotomy Trainer
  category: airway
  url: https://www.thingiverse.com/thing:2530474
  source: Thingiverse
  notes: Free neck-and-larynx combination trainer built to accompany the Vortex Approach CICO teaching material (vortexapproach.org). By drandybuck, CC BY-NC-ND 4.0.

- name: High-fidelity cric trainer (validated)
  category: airway
  url: https://jdc.jefferson.edu/otofp/122/
  source: OTO Open (journal)
  notes: Peer-reviewed 2026 study of a 3D-printed airway model layered with porcine soft tissue; trainee confidence rose significantly. The three STL files are free downloads under "Additional Files" on the article page. Schlegel, Tekumalla et al., Thomas Jefferson University, CC BY-NC-ND 4.0.

- name: Pediatric needle-cric scaling guide
  category: airway
  url: https://jetem.org/3d_airway/
  source: JETem (journal)
  notes: Open-access recipe for printing neonatal, school-age, and adolescent needle cricothyrotomy trainers by scaling an adult model to 25, 33, and 50 percent, with neonatal dimensions anchored to cadaveric measurements. Article CC BY 4.0; the base STL comes from The Airway App template library.

