# Models and resources hosted elsewhere. These render on the catalog page
# alongside the models stored in this repository.
#
# Fields: name (required), url (required), category, source, notes, credit,
# image (hotlinked preview URL from the source site; optional).
# Credit people by name only with their OK; "working group" is always fine.
# Public platform authors are credited by their published handle, as their
# licenses require attribution.

- name: Cric Airway Trainer
  category: airway
  url: https://makerworld.com/en/models/750065
  source: MakerWorld
  notes: Cricothyrotomy training model for physicians and paramedics; vinyl tape serves as the cricothyroid membrane. By HealthcareSim Guy, CC BY 4.0.
  image: https://makerworld.bblmw.com/makerworld/model/USff933ff0f8e202/design/2025-07-04_b283a143d18fa8.jpeg?x-oss-process=image/resize,w_1200/ignore-error,1

- name: Simple Cric Trainer and Mold
  category: airway
  url: https://www.printables.com/model/836133-simple-cric-trainer-and-mold
  source: Printables
  notes: Minimal cric trainer plus a casting mold; duct tape works for the membrane. By Miles L, CC BY 4.0.
  image: https://media.printables.com/media/prints/836133/images/6442606_c60fabe5-c7f2-4a2c-a0b0-b4931ffcfbc1_eb229b7c-7bde-454d-b558-e549e53125fa/thumbs/cover/1200x630/jpg/48ad24c7-7c44-4a17-a1b9-e3a8ed6d65ab.jpg

- name: CICO Rescue Cricothyroidotomy Trainer
  category: airway
  url: https://www.thingiverse.com/thing:2530474
  source: Thingiverse
  notes: Free neck-and-larynx combination trainer built to accompany the Vortex Approach CICO teaching material (vortexapproach.org). By drandybuck, CC BY-NC-ND 4.0. Start of the CICO lineage that ends in the NZ CPG v2.4 listed above; frankvdh's V2 remix (thing:2775062, CC BY-SA) adds support-free printing and a full airway lumen.

- name: High-fidelity cric trainer (validated)
  category: airway
  url: https://jdc.jefferson.edu/otofp/122/
  source: OTO Open (journal)
  notes: Peer-reviewed 2026 study of a 3D-printed airway model layered with porcine soft tissue; trainee confidence rose significantly. The three STL files are free downloads under "Additional Files" on the article page. Schlegel, Tekumalla et al., Thomas Jefferson University, CC BY-NC-ND 4.0.

- name: Pediatric needle-cric scaling guide
  category: airway
  url: https://jetem.org/3d_airway/
  source: JETem (journal)
  notes: Open-access recipe for printing neonatal, school-age, and adolescent needle cricothyrotomy trainers by scaling an adult model to 25, 33, and 50 percent, with neonatal dimensions anchored to cadaveric measurements. Article CC BY 4.0; the base STL comes from The Airway App template library.

- name: Silicone Airway Trainer Mold (intubation)
  category: airway
  url: https://makerworld.com/en/models/2706141
  source: MakerWorld
  notes: Mold set for casting a silicone intubation and airway-anatomy trainer in Ecoflex. By HealthcareSim Guy, CC BY-NC-SA 4.0.
  image: https://makerworld.bblmw.com/makerworld/model/US9506a9dcb64501/design/879d559a9bf0c957.jpeg?x-oss-process=image/resize,w_1200/ignore-error,1

- name: INCISA FN-1 Cricothyrotomy Trainer
  category: airway
  url: https://makerworld.com/en/models/3519582
  source: MakerWorld
  notes: Modular front-of-neck-access task trainer developed with the Kentuckiana Prehospital Education Consortium (KPEC). A printed neck base holds a soft TPU larynx and trachea under replaceable latex skin, with four airway variants and a BVM port. By OffShiftDesign, MakerWorld Exclusive License (free to print via MakerWorld; no redistribution).
  image: https://makerworld.bblmw.com/makerworld/model/USa24efef6adefa2/design/4237a160263bbaf3.jpg?x-oss-process=image/resize,w_1200/ignore-error,1

- name: CICO + Tracheostomy Trainer v2.4
  category: airway
  url: https://makerworld.com/en/models/1641122
  source: MakerWorld
  notes: The most evolved print of the Vortex CICO lineage. The New Zealand Clinical Printing Group (anaesthetists and ICU clinicians) unified their independent CICO trainer designs into one model, and this remix adds Bambu print profiles. Includes an alternative TPU larynx/trachea with a tracheostomy port, so blocked-trach and trach-change drills can be run alongside front-of-neck access. Original instructions PDF included. By Penfoolery after NZ CPG, MakerWorld Standard Digital File License (free to print; files not redistributable).
  image: https://makerworld.bblmw.com/makerworld/model/USfeed2e113b682c/design/2025-07-26_a817ea2fc451e.webp?x-oss-process=image/resize,w_1200/ignore-error,1

- name: Intubation Trainer with graded difficulty
  category: airway
  url: https://www.thingiverse.com/thing:6804629
  source: Thingiverse
  notes: Two-part exterior mold plus three interchangeable airway cores — easy, medium, and hard — for pouring silicone intubation trainers. The hard core adds tonsils, a narrow airway, an obstructing epiglottis, and an anterior trachea, so a program can run a real difficulty progression. Takes about 40 oz of silicone per pour. By gschappelle, CC BY-SA 4.0.

- name: Anti-Choke Trainer (adult + pediatric)
  category: airway
  url: https://makerworld.com/en/models/1666237
  source: MakerWorld
  notes: All-TPU training version of a suction anti-choking device with adult and pediatric mask variants, printed support-free with a 0%-infill seal lip so the mask seats softly on a manikin face. By PhantomCommit, MakerWorld Standard Digital File License (free to print; files not redistributable).
  image: https://makerworld.bblmw.com/makerworld/model/US18dbed3f0fbf49/design/2025-08-03_c6513c4e5b93d.jpg?x-oss-process=image/resize,w_1200/ignore-error,1

- name: DIY Video Laryngoscope (training)
  category: airway
  url: https://www.thingiverse.com/thing:3967800
  source: Thingiverse
  notes: Printed laryngoscope handle that takes a sub-10-euro USB endoscope camera, making a functional video laryngoscope for about 15 euros — built for tutoring and airway training where commercial VL is unaffordable. Derived from the airangelblade.org project with the original designer's blessing. By 30-1 (the IO trainer designer listed under vascular access), CC BY 4.0.

- name: Chest Tube Trainer (rib model)
  category: thoracic
  url: https://makerworld.com/en/models/2718035
  source: MakerWorld
  notes: Rib structure with silicone skin overlay for thoracostomy and chest tube placement; works standalone or strapped over an existing manikin. Derived from the Thingiverse rib section also listed here. By HealthcareSim Guy, CC BY-SA 4.0.
  image: https://makerworld.bblmw.com/makerworld/model/USf4ffce4d3310f3/design/392d2dcd0d62f855.jpeg?x-oss-process=image/resize,w_1200/ignore-error,1

- name: Wound Packing Trainer Mold — bullet
  category: hemorrhage-wound-care
  url: https://makerworld.com/en/models/1091410
  source: MakerWorld
  notes: Mold for casting a durable silicone wound-packing trainer with realistic depth and resistance, built for Stop the Bleed and trauma courses. By HealthcareSim Guy, CC BY-SA 4.0.
  image: https://makerworld.bblmw.com/makerworld/model/US2502c5ba37d93/design/695458619247a126.jpeg?x-oss-process=image/resize,w_1200/ignore-error,1

- name: Wound Packing Trainer Mold — laceration
  category: hemorrhage-wound-care
  url: https://makerworld.com/en/models/1091653
  source: MakerWorld
  notes: Companion mold to the bullet-wound version, casting a laceration-pattern packing trainer. By HealthcareSim Guy, CC BY-SA 4.0.
  image: https://makerworld.bblmw.com/makerworld/model/US6ec01df0c29484/design/03752c6bac2164cc.jpeg?x-oss-process=image/resize,w_1200/ignore-error,1

- name: SuSiPed suture pad molds and build guides
  category: hemorrhage-wound-care
  url: https://lmu-klinikum.de/hauner/kinderchirurgische-klinik-und-poliklinik/studium-fort-und-weiterbildung/simulationstraining/building-instructions/english/susiped-1-0/single-interrupted-suture-and-slipknot/e648f748122968d1
  source: LMU Klinikum (Munich)
  notes: Pediatric surgery teaching program publishing free STL molds, blockers, and holders for cast silicone suture pads, with step-by-step casting instructions in English. License unstated; link only.

- name: Ultrasound IV Trainer (gel phantom)
  category: ultrasound-phantoms
  url: https://makerworld.com/en/models/1994790
  source: MakerWorld
  notes: Reusable ultrasound-guided IV access trainer. The printed cavity takes an agar pour with a latex-balloon vessel, plus "seek and find" target objects for probe-skills practice. By OffShiftDesign, CC BY-NC-SA 4.0.
  image: https://makerworld.bblmw.com/makerworld/model/US6b3333ef2bf2eb/design/2025-11-13_eb08912f4013c8.jpg?x-oss-process=image/resize,w_1200/ignore-error,1

- name: Ultrasound Puncture Trainer
  category: ultrasound-phantoms
  url: https://makerworld.com/en/models/477592
  source: MakerWorld
  notes: Low-budget reusable ultrasound IV access trainer; agar-agar gel is cheap, melts down for re-pours, and discards into biological waste. By David, CC BY-NC 4.0.
  image: https://makerworld.bblmw.com/makerworld/model/USd38371036399d3/design/2024-05-28_777d7831e872c.jpg?x-oss-process=image/resize,w_1200/ignore-error,1

- name: Ultrasound Cannula Phantom
  category: ultrasound-phantoms
  url: https://www.printables.com/model/1305338-ultrasound-cannula-phantom
  source: Printables
  notes: Simple printed phantom for ultrasound-guided cannulation skills. By glfharris, CC BY-NC-SA 4.0.
  image: https://media.printables.com/media/prints/147b51c8-8180-4264-a8b2-3db8badf5abe/images/12866324_bb4267d6-cfdc-44a8-a060-b71189441674_408f2df1-620e-461c-b1c9-7b7bbc6d0b23/thumbs/cover/1200x630/jpg/diagram_box.jpg

- name: Ultrasound-Capable Central Line Trainer
  category: ultrasound-phantoms
  url: https://www.aliem.com/idea-series-ultrasound-capable-3d-printed-central-line-trainer/
  source: ALiEM (IDEA series)
  notes: Head-and-neck central line trainer for about $80 in materials — a printed head with emphasized sternocleidomastoid and clavicle landmarks takes a ballistic-gel neck insert from the included mold, with latex tubing vessels and an optional syringe for arterial pulsation on ultrasound. Head and mold files are in the linked public Google Drive. By Taylor Fischer PA-C (Wingate University); files' license unstated, link only.

- name: Wall-less vessel phantom construction (paper)
  category: ultrasound-phantoms
  url: https://discovery.ucl.ac.uk/id/eprint/1472123/
  source: J Ultrasound Med (UCL)
  notes: Peer-reviewed method for building vascular phantoms from printed chambers filled with agar, forming vessels by pulling out rods after the set — wall-less lumens image cleaner than embedded tubing. Free accepted manuscript at the link; the STL chamber files ship with the journal version. Nikitichev et al., 2016.

- name: Wearable Cric Trainer
  category: airway
  url: https://emcrit.org/emcrit/wearable-cric-trainer/
  source: EMCrit
  notes: Strap-on cricothyrotomy trainer worn by a live role-player, so the student manages a moving patient, not a block on a table. Build instructions at the link; the hosted STL link has been unreliable for years (dead as of Nov 2026), which is part of why this repository exists.
  credit: Shared in the Med Annex working group

- name: Chest Tube Simulator (rib section)
  category: thoracic
  url: https://www.thingiverse.com/thing:4018084
  source: Thingiverse
  notes: Printable rib section for finger thoracostomy, chest tube, and needle decompression landmark practice. Overlay with gelatin, foam, or pork belly for tissue feel. By 2theRescue, CC BY 4.0.
  credit: Shared in the Med Annex working group

- name: Intraosseous Access Training Device
  category: vascular-access
  url: https://www.thingiverse.com/thing:4157805
  source: Thingiverse
  notes: Printable proximal tibia IO trainer. Designer recommends PLA at 40 percent infill for the tibia and 70 percent for the cover; infill sets the cortical "give". By 30-1, CC BY 4.0.
  credit: Shared in the Med Annex working group

- name: IV Trainer Access Trainer
  category: vascular-access
  url: https://makerworld.com/en/models/1326752
  source: MakerWorld
  notes: Strap-on venous access trainer with rails for threading elastic or velcro to secure it to a live role-player's arm or leg; an old infusion line serves as the vein. 180+ ratings. By 3DMillo, MakerWorld Standard Digital File License (free to print; files not redistributable).
  image: https://makerworld.bblmw.com/makerworld/model/USade9bcf41aa2d9/design/2025-04-17_658c59c7e45b98.jpg?x-oss-process=image/resize,w_1200/ignore-error,1

- name: IV Trainer Pro
  category: vascular-access
  url: https://makerworld.com/en/models/1969964
  source: MakerWorld
  notes: Compact venous access block for IV placement and infusion practice, built for skills labs that can't justify commercial training arms. By Leo Maggi, MakerWorld Standard Digital File License (free to print; files not redistributable).
  image: https://makerworld.bblmw.com/makerworld/model/US62210d01589410/design/2025-11-07_31e23b5102be6.jpg?x-oss-process=image/resize,w_1200/ignore-error,1

- name: VeinGuide Venipuncture Training Arm
  category: vascular-access
  url: https://makerworld.com/en/models/3481887
  source: MakerWorld
  notes: Part-task venipuncture and blood-draw arm. Latex tubing veins sit under 1 mm tattoo-practice skin tensioned drum-tight by printed clamps and thumbwheels, so vein location, anchoring, insertion, and flashback all feel right. By 469 Franklin Workshop, CC0 public domain (mirrorable).
  image: https://makerworld.bblmw.com/makerworld/model/US29aca61c8e6b66/design/da2bf59785eb0bb4.jpg?x-oss-process=image/resize,w_1200/ignore-error,1

- name: Pneumatic Thoracostomy Sim Trainer
  category: thoracic
  url: https://makerworld.com/en/models/2704258
  source: MakerWorld
  notes: Active pneumothorax trainer that installs inside a standard CPR manikin. Embedded solenoids, pressure sensors, and an ESP32 give real air-puff feedback for needle decompression and finger thoracostomy. By OffShiftDesign, CC BY-NC-SA 4.0.
  image: https://makerworld.bblmw.com/makerworld/model/US991efe526ab4ce/design/132474a59d12090b.png?x-oss-process=image/resize,w_1200/ignore-error,1

- name: Pericardiocentesis Teaching Model — blind (subxiphoid)
  category: thoracic
  url: https://grabcad.com/library/blind-pericardiocentesis-1
  source: GrabCAD
  notes: Printable rib-and-landmark model for blind subxiphoid pericardiocentesis, from an Albany Medical Center emergency medicine team. The companion peer-reviewed build guide (Lord, Lord & Geary, Clin Pract Cases Emerg Med 2021, CC BY 4.0) covers assembly and the gelatin pericardial sac. Files are free downloads with a GrabCAD account. By Garrett Lord, Spencer Lord MD, and Sean Geary MD.

- name: Pericardiocentesis Teaching Model — ultrasound-guided
  category: thoracic
  url: https://grabcad.com/library/ultrasound-guided-pericardiocentesis-1
  source: GrabCAD
  notes: Ultrasound-guided companion to the blind subxiphoid model above, echogenic enough for probe-guided needle practice on the same low-cost build. Same Albany Medical Center team and CC BY 4.0 companion paper; files free with a GrabCAD account.

- name: Burr Hole Model
  category: head-spine
  url: https://makerworld.com/en/models/34695-burr-hole-model
  source: MakerWorld
  notes: Emergency burr hole task trainer built to train emergency medicine residents. A printed skull holds a bag of "blood" over the brain; only the small bone insert reprints after each drill, and a silicone or clay sheet serves as scalp. By maureen.nemetski, CC BY-NC-SA 4.0.
  image: https://makerworld.bblmw.com/makerworld/model/DSM00000000034695/design/2023-10-06_8essrat0zeg2.jpeg?x-oss-process=image/resize,w_1200/ignore-error,1

- name: UCSF Lumbar Puncture Simulator
  category: head-spine
  url: https://3d.nih.gov/entries/3DPX-018069
  source: NIH 3D
  notes: Cost-effective lumbar puncture and intrathecal access simulator from the UCSF Makers Lab — 3D printed components plus silicone-cast tissue, designed to pair with the freely available "Articulating Lumbar Vertebrae" model by DaveMakesStuff. By ucsfmakerslab, CC BY-NC 4.0.

- name: Gelatin eye model set (lateral canthotomy)
  category: head-spine
  url: https://jetem.org/?p=19360
  source: JETem (journal)
  notes: Open-access recipe for cheap gelatin eye models that drop into an existing 3D-printed face model, covering lateral canthotomy plus foreign body removal, fluorescein staining, and tonometry practice. No printable canthotomy trainer exists on any open platform (swept Nov 2026), so this VCU build guide is the lane's best open resource. Maupin et al., CC BY 4.0.

- name: OpenHumerus IO Access Trainer
  category: vascular-access
  url: https://3d.nih.gov/entries/3DPX-011941
  source: NIH 3D
  notes: Open-source humeral head IO access trainer, the proximal-humerus companion to the designer's OpenTibia model. A reusable base holds small replaceable humeral-head inserts so the model restores cheaply after several access attempts; 5-6 layers of foam medical tape simulate the dermis. By Brooks Dillahunty, CC BY-NC-ND 4.0.

- name: Umbilical Vein Catheterization Trainer
  category: vascular-access
  url: https://3d.nih.gov/entries/3DPX-023817
  source: NIH 3D
  notes: Low-cost neonatal umbilical venous catheterization task trainer. Reusable silicone body, a replaceable cannulatable three-vessel cord, and a fluid reservoir cover vessel identification, catheter insertion, aspiration, and fluid administration without a full neonatal manikin. By irenejunmd, CC BY-NC 4.0.

- name: OpenTibia IO Access Simulator
  category: vascular-access
  url: https://www.thingiverse.com/thing:2750234
  source: Thingiverse
  notes: Open-source tibial IO trainer with a removable panel over the insertion site, created for inexpensive training in developing-country medical communities and field-proven in Haiti. The tibial companion to the OpenHumerus trainer listed here, by the same designer. By Bdillahunty (Brooks Dillahunty), CC BY-NC-ND 4.0.

- name: Distal Femur IO Trainer
  category: vascular-access
  url: https://www.printables.com/model/1011433-distal-femur-io-trainer
  source: Printables
  notes: Distal femur IO access trainer with a replaceable hatch, completing the IO site set alongside the tibial and humeral trainers listed here — the distal femur is the preferred pediatric alternate site. By Miles L, CC BY-NC-SA 4.0.
  image: https://media.printables.com/media/prints/1011433/images/7688028_af9ee53c-9451-4d9b-84dd-a82f750d3632_3f1932f7-0df7-4bd7-8e42-17d0c9a7c4c5/thumbs/cover/1200x630/png/img_3230.png

- name: Surgical Suture Pad Mold
  category: hemorrhage-wound-care
  url: https://makerworld.com/en/models/221704
  source: MakerWorld
  notes: One-piece mold for casting silicone suture pads for laceration repair practice. Simpler than the LMU SuSiPed system and carries a clear open license. By MedLit Inovation, CC BY-SA 4.0.
  image: https://makerworld.bblmw.com/makerworld/model/USb58f47de22394e/design/2024-03-03_1cf1aeca99bbb.jpg?x-oss-process=image/resize,w_1200/ignore-error,1

- name: Pediatric Otic & Nasal Foreign Body Trainer
  category: head-spine
  url: https://www.thingiverse.com/thing:7214965
  source: Thingiverse
  notes: Validated task trainer for ear and nose foreign body removal — a printed 5-year-old-scale head with a tiltable base takes snap-in silicone ears and nares cast from the included molds (Ecoflex 00-30). Under $25 in materials, about $3 per replacement part, no visible wear after 50+ users. From a UT Southwestern / Texas Children's team. By DrLith (Lith Nasif MD et al.), CC BY-SA 4.0.

- name: TMJ Dislocation Reduction Trainer (build guide)
  category: head-spine
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC11793843/
  source: Cureus (journal)
  notes: Peer-reviewed build guide for a jaw dislocation reduction trainer costing under $20 — a printed skull and mandible (free Thingiverse skull, thing:819046) joined with hardware-store screws, with elastic bands standing in for masseter and pterygoid tension. Adjustable resistance, about two days of printing and an hour of assembly. Shin, Wang & Huang, CC BY 4.0.

